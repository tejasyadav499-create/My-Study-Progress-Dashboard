<html>

<head>
    <title>My Study Progress Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  >
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .jumbotron {
            background-color: #e3f2fd;
            border-bottom: 4px solid #007bff;
        }
    </style>
</head>

<body>

  
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1 class="text-primary">🚀 My Study Progress Dashboard</h1>
            <p class="lead">Track your subjects, badges, and daily learning goals.</p>

           
            <button class="btn btn-primary">Math</button>
            <button class="btn btn-success">Science</button>
            <button class="btn btn-warning">English</button>
            <button class="btn btn-danger">Coding</button>
        </div>
    </div>

    <div class="container">

     
        <h3 class="mb-3">Lessons Completed <span class="badge badge-pill badge-danger">24 Total</span></h3>
        <p>Math <span class="badge badge-primary">8 lessons</span> <span class="badge badge-secondary">Star</span></p>
        <p>Science <span class="badge badge-success">6 lessons</span> <span
                class="badge badge-secondary">Explorer</span></p>
        <p>English <span class="badge badge-warning">5 lessons</span> <span class="badge badge-secondary">Reader</span>
        </p>
        <p>Coding <span class="badge badge-info">5 lessons</span> <span class="badge badge-secondary">Builder</span></p>

        <hr>

       
        <h3 class="mb-3">Subject Progress</h3>

        <p class="mb-1"><strong>Math</strong></p>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped bg-primary" style="width: 80%">80%</div>
        </div>

        <p class="mb-1"><strong>Science</strong></p>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped bg-success" style="width: 65%">65%</div>
        </div>

        <p class="mb-1"><strong>English</strong></p>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped bg-warning text-dark" style="width: 55%">55%</div>
        </div>

        <p class="mb-1"><strong>Coding</strong></p>
        <div class="progress mb-4">
            <div class="progress-bar progress-bar-striped bg-danger" style="width: 70%">70%</div>
        </div>

    </div>

</body>

</html>
