<html>

<head>
    <title>My Study Progress Dashboard</title>

    >
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #70afef;
        }

        .jumbotron {
            background-color: #0bba37;
            border-bottom: 4px solid #0ed9a0;
        }
    </style>
</head>

<body>


    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1 class="text-primary">🚀 My Study Progress Dashboard</h1>
            <p class="lead">Track your subjects, badges, and daily learning goals.</p>


            <button class="btn btn-primary">Math</button>
            <button class="btn btn-success">Science</button>
            <button class="btn btn-warning">English</button>
            <button class="btn btn-danger">Coding</button>
        </div>
    </div>

    <div class="container">


        <h3 class="mb-3">Lessons Completed <span class="badge badge-pill badge-danger">21 Total</span></h3>
        <p>Math <span class="badge badge-primary">5 lessons</span> <span class="badge badge-secondary">Star</span></p>
        <p>Science <span class="badge badge-success">9 lessons</span> <span
                class="badge badge-secondary">Explorer</span></p>
        <p>English <span class="badge badge-warning">4 lessons</span> <span class="badge badge-secondary">Reader</span>
        </p>
        <p>Coding <span class="badge badge-info"> 3lessons</span> <span class="badge badge-secondary">Builder</span></p>

        <hr>


        <h3 class="mb-3">Subject Progress</h3>

        <p class="mb-1"><strong>Math</strong></p>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped bg-primary" style="width: 64%">64%</div>
        </div>

        <p class="mb-1"><strong>Science</strong></p>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped bg-success" style="width: 27%">27%</div>
        </div>

        <p class="mb-1"><strong>English</strong></p>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped bg-warning text-dark" style="width: 59%">59</div>
        </div>

        <p class="mb-1"><strong>Coding</strong></p>
        <div class="progress mb-4">
            <div class="progress-bar progress-bar-striped bg-danger" style="width: 43%">43</div>
        </div>

    </div>

</body>

</html>
